data_module:
  _target_: lam.lightning.arctic.ArcticDataModule
  data_path: /lustre/fsn1/projects/rech/iyg/uvx44rt/arctic/data   # ARCTIC's data/ folder: images/, splits_json/
  contact_path: /lustre/fsn1/projects/rech/iyg/uvx44rt/arctic/contacts   # written by lam/datasets/arctic/preprocess.py
  mano_uv_path: /lustre/fsn1/projects/rech/iyg/uvx44rt/mano/mano_uv.npz  # written by lam/datasets/build_mano_uv.py
  window_size: 16                  # 4 frames between samples with num_context=4, about 0.13 s at 30 Hz, as EgoTouch
  num_context: 4
  patch_size: 16                   # the patch size of dinov3_vitb16
  img_size: 224
  aug: false
  backbone_name: dinov3
  contact_threshold: 0.01          # m, EgoTac's threshold
  contact_repr: uv                 # uv: the MANO UV map shared with EgoTouch, vertex: the 778 MANO vertices
  protocol: p1
  val_split: val
  batch_size: 32
  num_workers: 6
