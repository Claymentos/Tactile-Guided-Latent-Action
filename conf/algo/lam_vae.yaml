model:
  _target_: lam.lam.LAMVAE
  patch_size: 16
  encoder:
    _target_: lam.modules.blocks.SpatioTemporalTransformer
    in_dim: 768
    model_dim: 512
    latent_dim: 32
    enc_blocks: 8
    dec_blocks: 8
    num_heads: 8
    dropout: 0.1
  decoder:
    _target_: lam.modules.blocks.SpatioTransformer
    in_dim: 3
    model_dim: 512
    out_dim: 768
    num_blocks: 8
    num_heads: 8
    dropout: 0.1
  action_prompt : 
    _target_: torch.nn.Parameter
    data: 
      _target_: torch.empty
      size: [1,1,1, 768]
  fc:
    _target_: torch.nn.Linear
    in_features: 512
    out_features: 64
  patch_up:
    _target_: torch.nn.Linear
    in_features: 768
    out_features: 512
  action_up:
    _target_: torch.nn.Linear
    in_features: 32
    out_features: 512
