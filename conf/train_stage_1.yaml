default:
  - data: rlds
  
lightning_module:
  _target_: lam.lightning.lam.DINO_LAM
  image_channels: 3
  lam_model_dim:  512
  lam_latent_dim: 32
  lam_num_latents: 8
  lam_patch_size: 16
  lam_enc_blocks: 8
  lam_dec_blocks: 8
  lam_num_heads:  8
  lam_dropout: 0.0
  vq_beta: 0.25
  log_interval: 1000
  log_path: log_imgs
  task_name: lam_openx
  stage: stage-1

trainer:
  _target_: lightning.Trainer
  default_root_dir: ./runs
  fast_dev_run: false
  log_every_n_steps: 100
  max_steps: 300_000
  gradient_clip_val: 1.0
  val_check_interval: 0.2
  precision: bf16-mixed
  logger:
    _target_: lightning.pytorch.loggers.WandbLogger
    name: lam_ego4d
    save_dir: ${trainer.default_root_dir}
    mode: offline 
    project: LAM
    resume: allow
    save_code: true
  callbacks:
    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: step
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      every_n_train_steps: 30_000