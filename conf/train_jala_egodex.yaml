# JALA-LAM sur EgoDex : python train.py --config-name train_jala_egodex
defaults:
  - algo: jala
  - algo/feature_extractor: dinov3_vitb16
  - data: egodex
  - _self_                         # en dernier : les valeurs ci-dessous surchargent les defaults

checkpoint_path: null

algo:
  feature_extractor:
    model:
      repo_path: dinov3                                              # relatif à la racine du repo (comme tactile_vdvae)
      weights_path: weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth

data:
  data_module:
    window_size: 16                # 5 frames espacées de 4 (≈ 0.13 s à 30 fps) : 4 transitions par clip
    num_context: 4
    patch_size: 16                 # images 224 x 384 pour DINOv3
    backbone_name: dinov3
    return_heatmaps: false
    validation_split: 0.02
    batch_size: 64
    num_workers: 12

lightning_module:
  _target_: lam.lightning.jala.JALATraining
  model: ${algo.model}
  learning_rate: 1e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_ratio: 0.05
  scheduler_max_steps: ${trainer.max_steps}
  use_task: true

trainer:
  _target_: lightning.Trainer
  default_root_dir: ./runs
  log_every_n_steps: 50
  max_steps: 100_000
  gradient_clip_val: 1.0
  val_check_interval: 2_000
  check_val_every_n_epoch: null    # validation tous les val_check_interval pas, indépendamment des époques
  limit_val_batches: 50
  precision: bf16-mixed
  logger:
    _target_: lightning.pytorch.loggers.WandbLogger
    name: jala_egodex
    save_dir: ${trainer.default_root_dir}
    mode: offline
    project: LAM
    resume: allow
    save_code: true
  callbacks:
    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: step
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      every_n_train_steps: 10_000
